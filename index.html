<header id="hd"></header><main id="m"></main><div id="ov"></div>

 let h=`<div class="card"><div class="row"><div><label class="l" style="margin-top:0">担当講師名</label><input type="text" data-e="teacher" value="${esc(E.teacher)}" placeholder="例: 山田"></div><div><label class="l" style="margin-top:0">記録日</label><input type="date" data-e="date" value="${esc(E.date)}"></div></div></div><div class="card"><h2>${n}</h2>`;
 if(n=="総合")h+=fld(["good","全体所見","area"],o)+fld(["kt","講習の提案方針(全体)","area"],o);
 else h+=`<label class="l" style="margin-top:0">理解度・定着度(1=要サポート 5=十分)</label>${rt(o)}`+fld(["good","できていること","area"],o)+fld(["issue","課題","area"],o)+fld(["kp","講習での優先度","c",["高","中","低","不要"]],o)+fld(["kt","講習で扱うべきこと","area"],o)+fld(["kc",`推奨コマ数(${KIND}は${KIND=="夏期"?4:3}コマ単位)`,"c",kcList(KIND)],o);
 h+=`</div>`;const t=E.teacher.trim(),ot=trs().filter(e=>e.stu==V.s&&e.subs[n]&&!(e.teacher==t&&e.date==E.date)).sort((a,b)=>a.date<b.date?1:-1);
 if(ot.length)h+=`<div class="card"><h2>他の講師の記録</h2>`+ot.map(e=>`<div class="tn"><b>${esc(e.teacher)}</b> <small>${e.date}</small><br>${tfmt(e.subs[n],n).map(esc).join("<br>")}</div>`).join("")+`</div>`;
 return h}
function pView(){const es=trs().filter(e=>e.stu==V.s),r=recOf(V.s,KIND)||{},pri=r.pri||[],u=KIND=="夏期"?4:3,tot=SUBS.reduce((s,n)=>s+(parseInt(P.rows[n])||0),0);
 let h=`<div class="card"><h2>${KIND}講習の提案</h2><p class="hint">${u}コマ単位 ・ 提案合計 <b style="color:var(--ac);font-size:16px">${tot}コマ</b></p><div class="ch">${PS.map(x=>`<button data-c="status" data-v="${x}" class="${(P.status||"未提案")==x?"on":""}">${x}</button>`).join("")}</div></div>`;
 SUBS.forEach(n=>{const i=pri.indexOf(n),x=es.filter(e=>e.subs[n]&&(e.subs[n].kp||e.subs[n].kc||e.subs[n].kt)),g=r.sub&&r.sub[n]&&r.sub[n].r;
  h+=`<div class="card"><b style="font-size:16px">${n}</b> ${i>=0?`<span class="bg">本人${i+1}位</span>`:""} ${g?`<small style="color:var(--sub)">本人の得意度 ${g}/5</small>`:""}`+x.map(e=>{const d=e.subs[n];return `<div class="tn"><small>${esc(e.teacher)}</small> ${d.kp?"優先度 <b>"+esc(d.kp)+"</b>":""} ${d.kc?"/ 推奨 "+esc(d.kc):""}${d.kt?"<br>"+esc(d.kt):""}</div>`}).join("")+`<label class="l">提案コマ数</label><div class="ch">${kcList(KIND).map(c=>`<button data-pr="${n}" data-v="${c}" class="${P.rows[n]==c?"on":""}">${c}</button>`).join("")}</div></div>`});
 return h+`<div class="card"><label class="l" style="margin-top:0">面談メモ(保護者の反応・見送り理由・次回連絡日など)</label><textarea data-k="memo">${esc(P.memo)}</textarea></div><button class="btn p" id="cpp" style="width:100%">提案シートをコピー</button>`}
/* テキスト */
function showTxt(t,x){$("#ov").innerHTML=`<div class="ov"><h2>${t}</h2><pre id="sx">${esc(x)}</pre><div class="row" style="margin-top:12px"><button class="btn" id="cl">閉じる</button><button class="btn p" id="cp">コピー</button></div></div>`;
 $("#cl").onclick=()=>$("#ov").innerHTML="";$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(x);toast("コピーしました")}catch(e){const r=document.createRange();r.selectNodeContents($("#sx"));getSelection().removeAllRanges();getSelection().addRange(r);toast("選択しました。コピーしてください")}}}
function hText(){const L=[`【${KIND}面談 ヒアリング】`,`${V.s} ${(stu(V.s)||{}).g||""}`,""];
 HS.forEach(s=>{const o=[];if(s.k=="sub")SUBS.forEach(n=>{const d=R.sub[n];d&&(d.r||d.m)&&o.push(`・${n}: ${d.r?"得意度"+d.r+"/5 ":""}${d.m||""}`)});
  else if(s.k=="tests")R.tests.forEach(t=>{(t.n||t.s)&&o.push(`・${t.n||""}(${t.d||"-"}) ${t.s||""} ${t.m||""}`)});
  else{s.k=="ks"&&R.pri&&R.pri.length&&o.push("・伸ばしたい教科: "+R.pri.map((n,i)=>(i+1)+"位 "+n).join("、"));s.f.forEach(f=>{let v=R[f[0]];Array.isArray(v)&&(v=v.join("、"));v&&o.push(`・${f[1]}: ${v}`)})}
  o.length&&L.push(`■${s.t}`,...o,"")});return L.join("\n")}
function pText(){const es=trs().filter(e=>e.stu==V.s),r=recOf(V.s,KIND)||{},pri=r.pri||[],L=[`【${V.s} ${KIND}講習 ご提案】`,`提案状況: ${P.status||"未提案"}`,""];let t=0;
 SUBS.forEach(n=>{const c=P.rows[n];if(!c)return;t+=parseInt(c)||0;const x=es.filter(e=>e.subs[n]&&e.subs[n].kt).map(e=>e.subs[n].kt);L.push(`■${n}: ${c}${pri.includes(n)?`(本人希望${pri.indexOf(n)+1}位)`:""}`,...x.map(s=>"　"+s))});
 L.push("",`合計: ${t}コマ`);P.memo&&L.push("",`メモ: ${P.memo}`);return L.join("\n")}
/* イベント */
document.addEventListener("click",e=>{const b=e.target.closest("button,.st");if(!b)return;const d=b.dataset;
 if(d.o)return openS(d.o);
 if(b.id=="bk"){V.s=null;return render()}
 if(b.id=="datab")return dataUI();
 if(b.id=="adds"){const n=(prompt("生徒名を入力してください")||"").trim();if(n){if(!stu(n)){ST.unshift({n,g:"",ts:Date.now()});put("ti_stu",ST)}openS(n)}return}
 if(d.kd){KIND=d.kd;put("ti_kind",KIND);if(V.s){loadR();loadP()}return render()}
 if(d.tab){V.t=d.tab;render();return scrollTo(0,0)}
 if(d.stp!=null){V.t=="h"?V.hs=+d.stp:V.ks=+d.stp;render();return scrollTo(0,0)}
 if(d.hs){V.hs=Math.max(0,Math.min(HS.length-1,V.hs+ +d.hs));render();return scrollTo(0,0)}
 if(b.id=="tm"){run=!run;clearInterval(tmr);if(run)tmr=setInterval(()=>{sec++;const t=$("#tm");if(t){t.textContent=`⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;t.classList.toggle("over",sec>=300)}},1e3);return}
 if(b.id=="addt"){R.tests.push({});saveR();return render()}
 if(b.id=="cph")return showTxt("ヒアリング要約",hText());
 if(b.id=="cpp")return showTxt("講習提案シート",pText());
 if(d.p){const p=R.pri=R.pri||[],i=p.indexOf(d.p);if(i>=0)p.splice(i,1);else if(p.length<3)p.push(d.p);else return toast("3つまで選べます");
  b.parentNode.querySelectorAll("button").forEach(x=>{const j=p.indexOf(x.dataset.p);x.classList.toggle("on",j>=0);x.textContent=(j>=0?(j+1)+"位 ":"")+x.dataset.p});return commit()}
 if(d.pr){P.rows[d.pr]=P.rows[d.pr]==d.v?"":d.v;saveP();return render()}
 if(d.c||d.r){const o=cobj(b),k=d.c||"r";
  if(d.r)o.r=o.r==+d.r?0:+d.r;else if(d.m){const a=o[k]||[];o[k]=a.includes(d.v)?a.filter(x=>x!=d.v):[...a,d.v]}else o[k]=o[k]==d.v?"":d.v;
  b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",d.r?o.r==+x.dataset.r:Array.isArray(o[k])?o[k].includes(x.dataset.v):o[k]==x.dataset.v));commit()}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(d.q!=null){Q=t.value;return lst()}
 if(d.e){E[d.e]=t.value;if(d.e=="teacher")put("ti_tname",t.value.trim());return}
 if(d.k){(d.ti!=null?R.tests[+d.ti]:cobj(t))[d.k]=t.value;commit()}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
 if(t.id=="gr"){const s=stu(V.s);if(s){s.g=t.value;s.ts=Date.now();put("ti_stu",ST);if(recOf(V.s,KIND))saveR()}return}
 if(d.e){const f=mergeE();if(!f&&d.e=="date")E.subs={};if(f||d.e=="date")render()}});
/* データ書き出し・統合 */
const K=[["recs","ti_recs",x=>x._id,x=>x._ts],["tr","ti_tr",x=>norm(x.stu)+"|"+norm(x.teacher)+"|"+x.date,x=>x.ts],["pl","ti_pl",x=>norm(x.stu)+"|"+x.kind,x=>x.ts],["st","ti_stu",x=>norm(x.n),x=>x.ts]];
const bundle=()=>({app:"ti",v:2,dev:load("ti_dev")||"",at:Date.now(),recs:recs(),tr:trs(),pl:pls(),st:ST});
function mplan(bs){const out={},st={n:0,u:0};K.forEach(([f,key,kf,tf])=>{const m=new Map((load(key)||[]).map(x=>[kf(x),x]));bs.forEach(b=>(b[f]||[]).forEach(x=>{const k=kf(x),o=m.get(k);if(!o){m.set(k,x);st.n++}else if((tf(x)||0)>(tf(o)||0)){m.set(k,x);st.u++}}));out[key]=[...m.values()]});return{out,st}}
function parseB(t,src){let b;try{b=JSON.parse(t)}catch(e){throw src+": 読み取れませんでした"}if(!b||b.app!="ti")throw src+": このアプリのデータではありません";return b}
async function expFile(){const b=bundle(),name=`生徒対話_${(b.dev||"端末").replace(/[\\\/:*?"<>|\s]/g,"")}_${today().replace(/-/g,"")}.json`,data=JSON.stringify(b);let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
 const ok=()=>{put("ti_lastexp",Date.now());toast("書き出しました");dataUI()};
 if(dl){try{await dl.save({filename:name,data});ok()}catch(e){if(!e||e.code!="declined")toast("ファイル保存できません。テキスト表示をお使いください")}return}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();ok()}catch(e){toast("保存できません。テキスト表示をお使いください")}}
function dataUI(){const bk=load("ti_bak"),le=load("ti_lastexp");
 $("#ov").innerHTML=`<div class="ov"><h2>データの書き出し・統合</h2><p class="hint">この端末: 生徒${ST.length}名 / ヒアリング${recs().length}件 / 講師記録${trs().length}件 / 提案${pls().length}件<br>最終書き出し: ${le?fmtD(le):"まだありません"}</p>
 <div class="card"><label class="l" style="margin-top:0">この端末の名前</label><input type="text" id="devn" value="${esc(load("ti_dev")||"")}" placeholder="例: 教室A / 山田先生のスマホ"></div>
 <div class="card"><h2>① 書き出し(各端末で)</h2><div class="row"><button class="btn p" id="exf">ファイルで保存</button><button class="btn" id="ext">テキスト表示</button></div></div>
 <div class="card"><h2>② 取り込み・統合(まとめ役の端末で)</h2><p class="hint">同じ記録は更新日時が新しい方を採用します。</p><input type="file" id="imf" accept=".json,application/json" multiple><label class="l">またはテキストを貼り付け</label><textarea id="imt"></textarea><button class="btn" id="imb" style="width:100%;margin-top:8px">内容を確認</button><div id="imr" style="margin-top:10px"></div></div>
 ${bk?`<button class="btn" id="undo" style="width:100%;margin-bottom:8px">↩ 直前の統合を取り消す(${fmtD(bk.at)}の状態へ)</button>`:""}<button class="btn" id="cl" style="width:100%">閉じる</button></div>`;
 $("#cl").onclick=()=>{$("#ov").innerHTML="";render()};$("#devn").oninput=e=>put("ti_dev",e.target.value.trim());$("#exf").onclick=expFile;
 $("#ext").onclick=()=>{put("ti_lastexp",Date.now());showTxt("書き出しテキスト(コピーして保存)",JSON.stringify(bundle()))};
 if(bk)$("#undo").onclick=()=>{if(confirm("統合前の状態に戻します。よろしいですか?")){K.forEach(([f,key])=>put(key,bk[key]||[]));ST=load("ti_stu")||[];toast("元に戻しました");dataUI()}};
 $("#imb").onclick=async()=>{const bs=[],er=[];for(const f of $("#imf").files){try{bs.push(parseB(await f.text(),f.name))}catch(x){er.push(String(x))}}
  const tx=$("#imt").value.trim();if(tx){try{bs.push(parseB(tx,"貼り付けテキスト"))}catch(x){er.push(String(x))}}
  const o=$("#imr");if(!bs.length&&!er.length){o.innerHTML=`<p class="hint">ファイルを選ぶか、テキストを貼り付けてください</p>`;return}
  const p=mplan(bs);o.innerHTML=er.map(x=>`<p style="color:var(--wn)">${esc(x)}</p>`).join("")+bs.map(b=>`<div class="tn"><b>${esc(b.dev||"端末名なし")}</b> <small>${fmtD(b.at)} 書き出し</small><br>生徒${(b.st||[]).length}名・ヒアリング${(b.recs||[]).length}件・講師記録${(b.tr||[]).length}件・提案${(b.pl||[]).length}件</div>`).join("")
   +(bs.length?`<div class="tn" style="background:var(--acb)"><b>統合結果</b>: 新規${p.st.n}件・更新${p.st.u}件</div><button class="btn p" id="imok" style="width:100%;margin-top:8px">統合して反映する</button>`:"");
  if(bs.length)$("#imok").onclick=()=>{const bak={at:Date.now()};K.forEach(([f,key])=>bak[key]=load(key)||[]);put("ti_bak",bak);K.forEach(([f,key])=>put(key,p.out[key]));ST=load("ti_stu")||[];toast("統合しました");dataUI()}}}
render();
</script></body></html>
